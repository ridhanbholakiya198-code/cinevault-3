<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Capture Stage</title>
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#07060d;overflow:hidden;font:14px system-ui,sans-serif;color:#eee}
#bg{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
 background:radial-gradient(1200px 700px at 12% 8%,#5b2bd6aa,transparent 60%),radial-gradient(900px 600px at 92% 96%,#d63a8faa,transparent 60%),#07060d}
#win{position:relative;overflow:hidden;background:#000;border-radius:14px;box-shadow:0 40px 120px #000c,0 0 0 1px #ffffff26}
body.flat #bg{background:#000}body.flat #win{border-radius:0;box-shadow:none}
#cam{position:absolute;left:0;top:0;width:1440px;height:900px;transform-origin:0 0}
#ifr{position:absolute;inset:0;width:1440px;height:900px;border:0;background:#000}
#cur{position:absolute;left:0;top:0;width:34px;height:34px;pointer-events:none;opacity:0;transition:opacity .3s;z-index:5;filter:drop-shadow(0 3px 5px #0009)}
#cur.on{opacity:1}#cur svg{width:100%;height:100%;transition:transform .12s}#cur.dn svg{transform:scale(.82)}
.rip{position:absolute;width:20px;height:20px;margin:-10px 0 0 -10px;border-radius:50%;border:3px solid #fff;pointer-events:none;z-index:4;animation:rp .7s ease-out forwards}
@keyframes rp{from{transform:scale(.4);opacity:.95}to{transform:scale(3.4);opacity:0}}
#fade{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .45s;z-index:15}
#cd{position:fixed;inset:0;display:none;align-items:center;justify-content:center;font:700 120px system-ui;z-index:20;background:#0008}
#stop{position:fixed;left:0;top:0;width:80px;height:80px;z-index:30}
#panel{position:fixed;left:0;right:0;bottom:0;max-height:75vh;overflow:auto;padding:14px;background:#111c;backdrop-filter:blur(14px);z-index:25;border-top:1px solid #fff2}
#panel.h{display:none}
#panel label{display:inline-flex;align-items:center;gap:6px;margin:4px 12px 4px 0}
#panel input[type=text],#panel input[type=number]{background:#000;color:#fff;border:1px solid #fff3;border-radius:8px;padding:8px;width:150px}
textarea{width:100%;height:170px;background:#000;color:#9fe;border:1px solid #fff3;border-radius:8px;padding:8px;font:12px monospace;margin-top:8px}
button{background:#7c4dff;color:#fff;border:0;border-radius:10px;padding:12px 18px;font:600 15px system-ui;margin:8px 8px 0 0}
button.g{background:#333}
#msg{margin-top:8px;color:#fc6;font-size:12px;white-space:pre-wrap}
#rot{display:none;color:#fc6;margin-bottom:6px}
@media(orientation:portrait){#rot{display:block}}
</style></head><body>
<div id="bg"><div id="win"><div id="cam">
 <iframe id="ifr" src="about:blank"></iframe>
 <div id="cur"><svg viewBox="0 0 24 24"><path d="M3 2l7.5 19 2.8-7.7L21 10.5z" fill="#fff" stroke="#000" stroke-width="1.6" stroke-linejoin="round"/></svg></div>
</div></div></div>
<div id="fade"></div><div id="cd"></div><div id="stop"></div>
<div id="panel">
 <div id="rot">Phone ko landscape me ghumao (wide screen).</div>
 <label>Site path <input type="text" id="path" value="/index.html"></label>
 <label>Countdown (sec) <input type="number" id="cdn" value="5" min="1" max="15" style="width:70px"></label><br>
 <label>Screen <select id="mode"><option value="fit">Fit 1440x900 (premium frame)</option><option value="wide">Wide - poori screen bhare</option></select></label><br>
 <label><input type="checkbox" id="fr" checked> Frame + gradient</label>
 <label><input type="checkbox" id="bl"> Motion blur</label>
 <label><input type="checkbox" id="fs" checked> Fullscreen</label>
 <textarea id="scr" spellcheck="false"></textarea>
 <button id="go">&#9654; Start (countdown)</button><button class="g" id="rs">Reset script</button>
 <div style="margin-top:8px;opacity:.7;font-size:12px">Pehle phone ka screen recorder start karo, phir Start dabao. Rukne ke liye top-left corner pe double-tap.<br>Actions: wait, zoom, move, click, type, scroll.</div>
 <div id="msg"></div>
</div>
<script>
const $=s=>document.querySelector(s),sleep=ms=>new Promise(r=>setTimeout(r,ms));
let W=1440,H=900;const ifr=$('#ifr'),camEl=$('#cam'),win=$('#win'),curEl=$('#cur');
const DEF=[
{"a":"mark","n":"01 intro+hero"},
{"a":"hold","on":true},
{"a":"wait","ms":5400},
{"a":"move","to":"#htitle","z":1.7},
{"a":"wait","ms":1700},
{"a":"zoom","z":1,"ms":1000},
{"a":"wait","ms":600},
{"a":"cut"},
{"a":"mark","n":"02 menu"},
{"a":"hold","on":true},
{"a":"wait","ms":1000},
{"a":"click","to":"#mnu"},
{"a":"wait","ms":1700},
{"a":"hover","to":".cvn-l button@Movies","hold":1100,"z":1.3},
{"a":"hover","to":".cvn-l button@Series","hold":1100},
{"a":"hover","to":".cvn-l button@Anime","hold":1100},
{"a":"hover","to":".cvn-l button@Browse","hold":1100},
{"a":"zoom","z":1,"ms":800},
{"a":"click","to":".cvn-x"},
{"a":"wait","ms":1000},
{"a":"cut"},
{"a":"mark","n":"03 detail+parallax"},
{"a":"hold","on":true},
{"a":"wait","ms":800},
{"a":"click","to":"#hmore"},
{"a":"wait","ms":2600},
{"a":"zoom","z":1.2,"to":"#modal","nocursor":true,"ms":900},
{"a":"scroll","in":"#modal","by":700,"ms":3200},
{"a":"wait","ms":800},
{"a":"scroll","in":"#modal","y":0,"ms":2200},
{"a":"zoom","z":1,"ms":700},
{"a":"cut","reload":false},
{"a":"mark","n":"04 mood+colour card"},
{"a":"click","to":"[data-cvt=mood]"},
{"a":"wait","ms":1500},
{"a":"zoom","z":1.4,"to":".mstills","ms":1000},
{"a":"wait","ms":1500},
{"a":"zoom","z":1.6,"to":"#mpal","ms":1000},
{"a":"wait","ms":700},
{"a":"click","to":"#mpal [data-h]"},
{"a":"wait","ms":1500},
{"a":"click","to":".mcardbtn"},
{"a":"wait","ms":2800},
{"a":"click","to":"[data-s=story]"},
{"a":"wait","ms":1800},
{"a":"zoom","z":1.25,"to":".cdi","ms":900},
{"a":"wait","ms":2200},
{"a":"zoom","z":1,"ms":700},
{"a":"click","to":"[data-a=x]"},
{"a":"wait","ms":800},
{"a":"cut"},
{"a":"mark","n":"05 spotlight"},
{"a":"wait","ms":700},
{"a":"scroll","to":"#cvspot","off":90,"ms":2600},
{"a":"zoom","z":1.35,"to":".sp-frame","ms":1000},
{"a":"wait","ms":1500},
{"a":"click","to":".sp-th [data-t='2']"},
{"a":"wait","ms":2200},
{"a":"click","to":".sp-th [data-t='3']"},
{"a":"wait","ms":2200},
{"a":"zoom","z":1,"ms":800},
{"a":"cut"},
{"a":"mark","n":"06 browse"},
{"a":"wait","ms":700},
{"a":"click","to":"nav [data-v=browse]"},
{"a":"wait","ms":2000},
{"a":"click","to":"button@Hidden gems"},
{"a":"wait","ms":2400},
{"a":"click","to":"button@Mind-bending"},
{"a":"wait","ms":2400},
{"a":"click","to":"[data-c=Crimson]"},
{"a":"wait","ms":2400},
{"a":"click","to":"[data-c=Violet]"},
{"a":"wait","ms":2600},
{"a":"cut"},
{"a":"mark","n":"07 tonight"},
{"a":"hold","on":true},
{"a":"wait","ms":900},
{"a":"click","to":"#mnu"},
{"a":"wait","ms":1600},
{"a":"click","to":".cvn-l button@Tonight"},
{"a":"wait","ms":1600},
{"a":"click","to":".tn .opts button@Regular"},
{"a":"wait","ms":1300},
{"a":"click","to":".tn .opts button@Mind-bending"},
{"a":"wait","ms":1300},
{"a":"click","to":".tn .opts button@English"},
{"a":"wait","ms":4000},
{"a":"zoom","z":1.3,"to":".tn .res","ms":1000},
{"a":"wait","ms":2200},
{"a":"zoom","z":1,"ms":800}
];
const cam={s:{z:1,x:W/2,y:H/2},m:{z:1,x:W/2,y:H/2},t:{z:1,x:W/2,y:H/2},follow:false,sp:4.5};
const cur={x:W*.8,y:H*.85};
let k=1,ww=0,wh=0,abort=false,running=false,blurOn=false;
function layout(){if($('#mode').value==='wide'){W=Math.max(1280,Math.min(1600,Math.round(900*innerWidth/innerHeight)));H=Math.max(560,Math.round(W*innerHeight/innerWidth))}else{W=1440;H=900}
 camEl.style.width=ifr.style.width=W+'px';camEl.style.height=ifr.style.height=H+'px';
 const flat=!$('#fr').checked;document.body.classList.toggle('flat',flat);
 const p=flat?0:.06,vw=innerWidth,vh=innerHeight;ww=Math.min(vw*(1-2*p),vh*(1-2*p)*W/H);wh=ww*H/W;
 win.style.width=ww+'px';win.style.height=wh+'px';k=ww/W}
addEventListener('resize',layout);$('#fr').onchange=layout;$('#mode').onchange=layout;
function drawCur(){curEl.style.transform=`translate(${cur.x-3}px,${cur.y-2}px)`}
let last=performance.now(),wc=0,lastMove=0;
function tick(t){const dt=Math.min(.05,(t-last)/1000);last=t;const a=1-Math.exp(-dt*cam.sp);
 if(cam.follow&&cam.t.z>1){cam.t.x=cur.x;cam.t.y=cur.y}
 const pz=cam.s.z,px=cam.s.x,py=cam.s.y;
 for(const q of['z','x','y']){cam.m[q]+=(cam.t[q]-cam.m[q])*a;cam.s[q]+=(cam.m[q]-cam.s[q])*a}
 const s=k*cam.s.z;let tx=ww/2-cam.s.x*s,ty=wh/2-cam.s.y*s;
 tx=Math.min(0,Math.max(ww-W*s,tx));ty=Math.min(0,Math.max(wh-H*s,ty));
 camEl.style.transform=`translate(${tx}px,${ty}px) scale(${s})`;
 const mv=Math.abs(cam.s.z-pz)*400+Math.abs(cam.s.x-px)+Math.abs(cam.s.y-py);
 if(mv>.15){lastMove=t;if(!wc){camEl.style.willChange='transform';wc=1}}else if(wc&&t-lastMove>350){camEl.style.willChange='auto';wc=0}
 if(blurOn){const v=Math.hypot(cam.s.z-pz,(cam.s.x-px)/W,(cam.s.y-py)/H)/Math.max(dt,.001);camEl.style.filter=`blur(${Math.min(1.5,v*.4).toFixed(2)}px)`}else camEl.style.filter='';
 requestAnimationFrame(tick)}
const D=()=>ifr.contentDocument,Wn=()=>ifr.contentWindow;
function find(sel){let e;
 if(sel.includes('@')){const[i,t]=sel.split('@'),q=t.trim().toLowerCase();
  e=[...D().querySelectorAll(i||'*')].filter(x=>x.getClientRects().length&&x.textContent.trim().toLowerCase().startsWith(q)).sort((a,b)=>a.textContent.length-b.textContent.length)[0]}
 else e=D().querySelector(sel);
 if(!e)throw Error('nahi mila: '+sel);return e}
const ctr=e=>{const r=e.getBoundingClientRect();return{x:r.left+r.width/2,y:r.top+r.height/2}};
function ease(p){return p<.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2}
function moveTo(x,y,ms){const d=Math.hypot(x-cur.x,y-cur.y);ms=ms||Math.max(450,Math.min(1400,d*1.1));
 const x0=cur.x,y0=cur.y,dx=x-x0,dy=y-y0,cx=x0+dx/2-dy*.12,cy=y0+dy/2+dx*.12;curEl.classList.add('on');
 return new Promise(res=>{const t0=performance.now();(function f(n){if(abort)return res();const p=ease(Math.min(1,(n-t0)/ms)),q=1-p;
  cur.x=q*q*x0+2*q*p*cx+p*p*x;cur.y=q*q*y0+2*q*p*cy+p*p*y;drawCur();p<1?requestAnimationFrame(f):res()})(t0)})}
function scrollTo(y,ms,el){const w=el||Wn(),y0=el?el.scrollTop:w.scrollY;return new Promise(res=>{const t0=performance.now();(function f(n){if(abort)return res();
 const p=ease(Math.min(1,(n-t0)/ms)),v=y0+(y-y0)*p;el?el.scrollTop=v:w.scrollTo(0,v);p<1?requestAnimationFrame(f):res()})(t0)})}
function scroller(e){for(let n=e.parentElement;n;n=n.parentElement){const o=Wn().getComputedStyle(n).overflowY;if((o==='auto'||o==='scroll')&&n.scrollHeight>n.clientHeight+4)return n}return null}
async function reveal(e){const r=e.getBoundingClientRect();if(r.top<90||r.bottom>H-90){const sc=scroller(e);
 if(sc&&sc!==D().body&&sc!==D().documentElement)await scrollTo(sc.scrollTop+r.top-sc.getBoundingClientRect().top-H/3,1100,sc);else await scrollTo(Wn().scrollY+r.top-H/3,1200)}}
function ripple(){const r=document.createElement('div');r.className='rip';r.style.left=cur.x+'px';r.style.top=cur.y+'px';camEl.appendChild(r);setTimeout(()=>r.remove(),800);
 curEl.classList.add('dn');setTimeout(()=>curEl.classList.remove('dn'),160)}
let marks=[],T0=0;
function resetCam(){for(const q of['s','m','t'])cam[q]={z:1,x:W/2,y:H/2};cam.follow=false;cur.x=W*.8;cur.y=H*.85;drawCur()}
function camMode(z){cam.sp=4.5;cam.t.z=z||1;if(z>1)cam.follow=true;else{cam.follow=false;cam.t.x=W/2;cam.t.y=H/2}}
async function aim(e,ms){await reveal(e);let c=ctr(e);await moveTo(c.x,c.y,ms);const c2=ctr(e);
 if(Math.hypot(c2.x-c.x,c2.y-c.y)>10){await moveTo(c2.x,c2.y,300);c=c2}return c}
function tapEl(t){const w=Wn();let n=t;while(n&&typeof n.click!=='function')n=n.parentElement;n=n||t;
 const o={bubbles:true,cancelable:true,view:w,pointerType:'mouse',button:0,clientX:cur.x,clientY:cur.y};
 for(const ty of['pointerdown','mousedown','pointerup','mouseup']){try{n.dispatchEvent(new(ty[0]=='p'?w.PointerEvent:w.MouseEvent)(ty,o))}catch(e){}}
 typeof n.click==='function'?n.click():n.dispatchEvent(new w.MouseEvent('click',o))}
const A={
 wait:s=>sleep(s.ms||500),
 async zoom(s){cam.sp=s.sp||4.5;const z=s.z||1;
  if(s.to){const e=find(s.to);await reveal(e);let c=ctr(e),mv;
   if(z>1&&!s.nocursor){mv=moveTo(c.x,c.y);await sleep(350);c=ctr(e)}
   cam.t.z=z;cam.t.x=c.x;cam.t.y=c.y;cam.follow=false;if(mv)await mv}
  else camMode(z);
  if(!s.nowait)await sleep(s.ms||800)},
 async move(s){const e=find(s.to);if(s.z!==undefined)camMode(s.z);await aim(e,s.ms)},
 async click(s){const e=find(s.to);if(s.z!==undefined)camMode(s.z);const c=await aim(e,s.ms);await sleep(120);ripple();
  tapEl(D().elementFromPoint(c.x,c.y)||e);await sleep(200)},
 async type(s){const e=find(s.to);e.focus();for(const ch of s.text){if(abort)return;e.value+=ch;
  e.dispatchEvent(new Event('input',{bubbles:true}));await sleep(s.gap||85)}},
 async scroll(s){const el=s.in?find(s.in):null,base=el?el.scrollTop:Wn().scrollY;
  const y=s.to?base+find(s.to).getBoundingClientRect().top-(el?el.getBoundingClientRect().top:0)-(s.off??120):s.by!=null?base+s.by:s.y;await scrollTo(y,s.ms||1800,el)},
 async hover(s){const e=find(s.to);if(s.z!==undefined)camMode(s.z);await aim(e,s.ms);
  for(const t of['pointerover','pointerenter'])e.dispatchEvent(new(Wn().PointerEvent)(t,{bubbles:true,pointerType:'mouse'}));await sleep(s.hold||1000)},
 hold:s=>{try{const d=D();s.on?Object.defineProperty(d,'hidden',{get:()=>true,configurable:true}):delete d.hidden}catch(e){}},
 mark:s=>{marks.push([s.n,(performance.now()-T0)/1000])},
 async cut(s){const f=$('#fade');f.style.transition='opacity .45s';f.style.opacity=1;await sleep(550);curEl.classList.remove('on');
  resetCam();
  if(s.reload===false){await sleep(s.hold||900);f.style.opacity=0;await sleep(500);return}
  await loadSite($('#path').value,false);await sleep(s.hold||600)}
};
async function run(steps){const bad=[];for(const s of steps){if(abort)break;
 try{await A[s.a](s)}catch(e){bad.push(s.a+': '+e.message)}}return bad}
function patchDoc(){try{const C=Wn().Clipboard.prototype;C.writeText=()=>Promise.resolve();C.write=()=>Promise.resolve()}catch(e){}}
function loadSite(path,intro=true,keep=false){const f=$('#fade');
 return new Promise(res=>{try{intro?sessionStorage.removeItem('cv_i'):sessionStorage.setItem('cv_i','1')}catch(e){}
  f.style.transition='none';f.style.opacity=1;ifr.src='about:blank';
  setTimeout(()=>{ifr.src=path+(path.includes('?')?'&':'?')+'stage='+Date.now();const t0=Date.now();
   const iv=setInterval(()=>{let ok=0;try{const d=ifr.contentDocument;ok=d&&d.body&&d.readyState!=='loading'&&d.location.href.indexOf('about:blank')<0}catch(e){}
    if(ok||Date.now()-t0>15000){clearInterval(iv);patchDoc();if(keep)return res();
     setTimeout(()=>{f.style.transition='opacity .3s';f.style.opacity=0;res()},intro?100:700)}},40)},150)})}
const fmt=t=>Math.floor(t/60)+':'+String(Math.floor(t%60)).padStart(2,'0');
async function start(){if(running)return;let steps;
 try{steps=JSON.parse($('#scr').value)}catch(e){$('#msg').textContent='Script JSON galat hai: '+e.message;return}
 try{localStorage.setItem('stg_scr',$('#scr').value)}catch(e){}
 running=true;abort=false;blurOn=$('#bl').checked;$('#msg').textContent='';marks=[];T0=performance.now();let wl;
 if($('#fs').checked)try{await document.documentElement.requestFullscreen()}catch(e){}
 try{wl=await navigator.wakeLock.request('screen')}catch(e){}
 layout();$('#panel').classList.add('h');curEl.classList.remove('on');resetCam();
 const f=$('#fade');f.style.transition='none';f.style.opacity=1;
 const n=+$('#cdn').value||5,cd=$('#cd');cd.style.display='flex';
 const pre=loadSite($('#path').value,false,true);
 for(let i=n;i>0&&!abort;i--){cd.textContent=i;await sleep(1000)}
 await pre;cd.style.display='none';
 if(!abort)await loadSite($('#path').value,true);
 const bad=abort?[]:await run(steps);
 marks.push(['END',(performance.now()-T0)/1000]);
 running=false;curEl.classList.remove('on');$('#fade').style.opacity=0;$('#panel').classList.remove('h');try{wl&&wl.release()}catch(e){}
 const lst=marks.map((m,i)=>m[0]==='END'?'':m[0]+'  '+fmt(m[1]+0)+' - '+fmt(marks[i+1][1])).filter(Boolean).join('\n');
 $('#msg').textContent=(abort?'Rok diya.':'Done - ab recorder stop karo.')+'\nCut list (Start dabane ke time se, countdown "5" dikhne wale moment se gino):\n'+lst+(bad.length?'\nSkip hue:\n'+bad.join('\n'):'')}
let tap=0;$('#stop').onclick=()=>{const n=Date.now();if(n-tap<500){abort=true;$('#cd').style.display='none'}tap=n};
$('#go').onclick=start;
$('#rs').onclick=()=>{$('#scr').value=JSON.stringify(DEF,null,1)};
try{if(localStorage.getItem('stg_ver')==='4')$('#scr').value=localStorage.getItem('stg_scr')||'';localStorage.setItem('stg_ver','4')}catch(e){}
if(!$('#scr').value)$('#rs').click();
layout();drawCur();requestAnimationFrame(tick);
</script></body></html>
