:root{color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#07060d;overflow:hidden;font:14px system-ui,sans-serif;color:#eee}
#bg{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
 background:radial-gradient(1200px 700px at 12% 8%,#5b2bd6aa,transparent 60%),radial-gradient(900px 600px at 92% 96%,#d63a8faa,transparent 60%),#07060d}
body.haspad #bg{padding-bottom:250px}
@media (orientation:landscape){body.haspad #bg{padding-bottom:0}}
#win{position:relative;overflow:hidden;background:#000;border-radius:14px;box-shadow:0 24px 60px #0009,0 0 0 1px #ffffff26}
body.flat #bg{background:#000}body.flat #win{border-radius:0;box-shadow:none}
#cam{position:absolute;left:0;top:0;width:1440px;height:900px;transform-origin:0 0}
#ifr{position:absolute;inset:0;width:1440px;height:900px;border:0;background:#000}
#cur{position:absolute;left:0;top:0;width:34px;height:34px;pointer-events:none;opacity:0;transition:opacity .3s;z-index:5;filter:drop-shadow(0 3px 5px #0009);will-change:transform}
#cur.on{opacity:1}#cur svg{width:100%;height:100%;transition:transform .12s}#cur.dn svg{transform:scale(.82)}
.rip{position:absolute;width:20px;height:20px;margin:-10px 0 0 -10px;border-radius:50%;border:3px solid #fff;pointer-events:none;z-index:4;animation:rp .7s ease-out forwards}
@keyframes rp{from{transform:scale(.4);opacity:.95}to{transform:scale(3.4);opacity:0}}
#fade{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;z-index:15}
#cd{position:fixed;inset:0;display:none;align-items:center;justify-content:center;font:700 120px system-ui;z-index:20;background:#000}
#stop{position:fixed;left:0;top:0;width:80px;height:80px;z-index:30}
#panel{position:fixed;left:0;right:0;bottom:0;max-height:80vh;overflow:auto;padding:14px;background:#111e;z-index:25;border-top:1px solid #fff2}
#panel.h{display:none}
#panel label{display:inline-flex;align-items:center;gap:6px;margin:4px 12px 4px 0}
#panel input[type=text],#panel input[type=number],#panel select{background:#000;color:#fff;border:1px solid #fff3;border-radius:8px;padding:8px}
#panel input[type=text]{width:150px}
textarea{width:100%;height:160px;background:#000;color:#9fe;border:1px solid #fff3;border-radius:8px;padding:8px;font:12px monospace;margin-top:8px}
button{background:#7c4dff;color:#fff;border:0;border-radius:10px;padding:12px 18px;font:600 15px system-ui;margin:8px 8px 0 0}
button.g{background:#333}
#msg{margin-top:8px;color:#fc6;font-size:12px;white-space:pre-wrap}
#info{margin-top:6px;opacity:.75;font-size:12px}
.mopts{margin:4px 0;padding:8px 10px;background:#ffffff0a;border:1px solid #ffffff1a;border-radius:10px}
.hide{display:none!important}
/* Virtual Trackpad (outside #win so recordings stay 100% clean) */
#tpad{position:fixed;left:10px;right:10px;bottom:10px;height:234px;max-width:540px;margin:0 auto;z-index:22;
 display:flex;flex-direction:column;gap:6px;padding:8px;border-radius:18px;
 background:rgba(14,12,24,.82);border:1px solid rgba(255,255,255,.16);
 box-shadow:0 12px 32px #0008;touch-action:none;user-select:none;-webkit-user-select:none}
@media (orientation:landscape){#tpad{height:176px;max-width:390px;left:auto;right:10px;bottom:10px;opacity:.88}}
#tpad-top{flex:1;display:flex;gap:6px;min-height:0}
#tpad-surf{flex:1;position:relative;border-radius:12px;background:rgba(255,255,255,.05);border:1px dashed rgba(255,255,255,.16);
 display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.38);font-size:11px;text-align:center;padding:8px;touch-action:none}
#tpad-scrl{width:50px;border-radius:12px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);
 display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:2px 0;color:rgba(255,255,255,.72);font-size:12px;touch-action:none}
#tpad-scrl button{width:100%;height:32px;margin:0;padding:0;background:transparent;color:rgba(255,255,255,.82);font-size:12px;border-radius:8px}
#tpad-scrl span{font-size:14px;opacity:.55;pointer-events:none}
.tp-row{display:flex;gap:6px;height:34px}
.tp-row button{flex:1;margin:0;padding:0 4px;font-size:11px;font-weight:600;border-radius:9px;background:rgba(255,255,255,.1);color:#eee;border:1px solid rgba(255,255,255,.12);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tp-row button.on{background:#7c4dff;border-color:#9e7bff;color:#fff}
.tp-row button.dw{background:#00bfa5;border-color:#5df2d6;color:#05201c}
/* Select dropdown picker for Trackpad/Manual mode */
#selpop{position:fixed;inset:0;z-index:35;background:rgba(0,0,0,.65);display:flex;align-items:center;justify-content:center;padding:18px}
#selbox{width:100%;max-width:340px;max-height:65vh;overflow:auto;background:#161424;border:1px solid #ffffff26;border-radius:16px;padding:10px;box-shadow:0 20px 50px #000b}

#selbox button.cur{background:#7c4dff;color:#fff;font-weight:600}
