<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="/stage.webmanifest">
<title>Capture Stage</title>
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#07060d;overflow:hidden;font:14px system-ui,sans-serif;color:#eee}
#bg{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
 background:radial-gradient(1200px 700px at 12% 8%,#5b2bd6aa,transparent 60%),radial-gradient(900px 600px at 92% 96%,#d63a8faa,transparent 60%),#07060d}
#win{position:relative;overflow:hidden;background:#000;border-radius:14px;box-shadow:0 24px 60px #0009,0 0 0 1px #ffffff26}
body.flat #bg{background:#000}body.flat #win{border-radius:0;box-shadow:none}
#cam{position:absolute;left:0;top:0;width:1440px;height:900px;transform-origin:0 0}
#ifr{position:absolute;inset:0;width:1440px;height:900px;border:0;background:#000}
#cur{position:absolute;left:0;top:0;width:34px;height:34px;pointer-events:none;opacity:0;transition:opacity .3s;z-index:5;filter:drop-shadow(0 3px 5px #0009)}
#cur.on{opacity:1}#cur svg{width:100%;height:100%;transition:transform .12s}#cur.dn svg{transform:scale(.82)}
.rip{position:absolute;width:20px;height:20px;margin:-10px 0 0 -10px;border-radius:50%;border:3px solid #fff;pointer-events:none;z-index:4;animation:rp .7s ease-out forwards}
@keyframes rp{from{transform:scale(.4);opacity:.95}to{transform:scale(3.4);opacity:0}}
#fade{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;z-index:15}
#cd{position:fixed;inset:0;display:none;align-items:center;justify-content:center;font:700 120px system-ui;z-index:20;background:#000}
#stop{position:fixed;left:0;top:0;width:80px;height:80px;z-index:30}
#panel{position:fixed;left:0;right:0;bottom:0;max-height:75vh;overflow:auto;padding:14px;background:#111e;z-index:25;border-top:1px solid #fff2}
#panel.h{display:none}
#panel label{display:inline-flex;align-items:center;gap:6px;margin:4px 12px 4px 0}
#panel input[type=text],#panel input[type=number],#panel select{background:#000;color:#fff;border:1px solid #fff3;border-radius:8px;padding:8px}
#panel input[type=text]{width:150px}
textarea{width:100%;height:170px;background:#000;color:#9fe;border:1px solid #fff3;border-radius:8px;padding:8px;font:12px monospace;margin-top:8px}
button{background:#7c4dff;color:#fff;border:0;border-radius:10px;padding:12px 18px;font:600 15px system-ui;margin:8px 8px 0 0}
button.g{background:#333}
#msg{margin-top:8px;color:#fc6;font-size:12px;white-space:pre-wrap}
#info{margin-top:6px;opacity:.75;font-size:12px}
</style></head><body>
<div id="bg"><div id="win"><div id="cam">
 <iframe id="ifr" src="about:blank"></iframe>
 <div id="cur"><svg viewBox="0 0 24 24"><path d="M3 2l7.5 19 2.8-7.7L21 10.5z" fill="#fff" stroke="#000" stroke-width="1.6" stroke-linejoin="round"/></svg></div>
</div><div id="fade"></div></div></div>
<div id="cd"></div><div id="stop"></div>
<div id="panel">
 <div id="info"></div>
 <label>Site path <input type="text" id="path" value="/index.html"></label>
 <label>Countdown (sec) <input type="number" id="cdn" value="5" min="1" max="15" style="width:70px"></label><br>
 <label>Screen <select id="mode"><option value="fit">Fit 1440x900 (premium frame)</option><option value="wide">Wide - poori screen bhare</option></select></label><br>
 <label>Pace <select id="pace"><option value="1">Normal</option><option value="1.25" selected>Slower</option><option value="1.5">Cinematic</option></select></label><br>
 <label><input type="checkbox" id="fr" checked> Frame + gradient</label>
 <label><input type="checkbox" id="bl"> Motion blur</label>
 <label><input type="checkbox" id="lite" checked> Lite effects (smooth video)</label>
 <label><input type="checkbox" id="fs"> Fullscreen API (agar black screen aaye to OFF rakho)</label>
 <textarea id="scr" spellcheck="false"></textarea>
 <button id="go">&#9654; Start (countdown)</button><button class="g" id="rs">Reset script</button>
 <div style="margin-top:8px;opacity:.7;font-size:12px">Pehle recorder start karo, phir Start dabao. Rukne ke liye top-left corner pe double-tap.<br>Actions: wait, auto, zoom, move, click, hover, type, scroll, hold, mark, cut.</div>
 <div id="msg"></div>
</div>
<script>
const $=s=>document.querySelector(s),sleep=ms=>new Promise(r=>setTimeout(r,ms));
let W=1440,H=900;
let ifr=$('#ifr');const camEl=$('#cam'),win=$('#win'),curEl=$('#cur'),fade=$('#fade');
const DEF=[
{"a":"mark","n":"01 intro+hero"},
{"a":"hold","on":true},
{"a":"wait","ms":6600},
{"a":"auto","z":0,"out":1500},
{"a":"move","to":"#htitle","z":1.5,"out":1800},
{"a":"wait","ms":2800},
{"a":"cut"},
{"a":"mark","n":"02 menu"},
{"a":"hold","on":true},
{"a":"wait","ms":900},
{"a":"click","to":"#mnu","nozoom":true},
{"a":"wait","ms":2000},
{"a":"hover","to":".cvn-l button@Movies","nozoom":true,"hold":1100},
{"a":"hover","to":".cvn-l button@Series","nozoom":true,"hold":1100},
{"a":"hover","to":".cvn-l button@Anime","nozoom":true,"hold":1100},
{"a":"hover","to":".cvn-l button@Browse","nozoom":true,"hold":1100},
{"a":"click","to":".cvn-x","nozoom":true},
{"a":"wait","ms":1000},
{"a":"cut","pre":[{"a":"tap","to":"#hmore"},{"a":"wait","ms":2400},{"a":"tap","to":"#mx"},{"a":"wait","ms":900}]},
{"a":"mark","n":"03 detail+parallax"},
{"a":"hold","on":true},
{"a":"wait","ms":600},
{"a":"click","to":"#hmore","nozoom":true},
{"a":"wait","ms":2500},
{"a":"scroll","in":"#modal","by":700,"ms":3200},
{"a":"wait","ms":800},
{"a":"scroll","in":"#modal","y":0,"ms":2200},
{"a":"wait","ms":400},
{"a":"cut","reload":false},
{"a":"mark","n":"04 mood+colour card"},
{"a":"click","to":"[data-cvt=mood]","nozoom":true},
{"a":"wait","ms":2400},
{"a":"scroll","in":"#modal","to":"#mpal","off":230,"ms":1600},
{"a":"wait","ms":900},
{"a":"click","to":"#mpal [data-h]","nozoom":true},
{"a":"wait","ms":2200},
{"a":"click","to":".mcardbtn","nozoom":true},
{"a":"wait","ms":4500},
{"a":"click","to":"[data-a=x]","nozoom":true},
{"a":"wait","ms":900},
{"a":"cut"},
{"a":"mark","n":"05 spotlight"},
{"a":"wait","ms":700},
{"a":"scroll","to":"#cvspot","off":90,"ms":2400},
{"a":"wait","ms":900},
{"a":"click","to":".sp-th [data-t='2']","nozoom":true},
{"a":"wait","ms":2800},
{"a":"click","to":".sp-th [data-t='3']","nozoom":true},
{"a":"wait","ms":2800},
{"a":"cut"},
{"a":"mark","n":"06 browse"},
{"a":"wait","ms":700},
{"a":"click","to":"nav [data-v=browse]","nozoom":true},
{"a":"wait","ms":2200},
{"a":"click","to":"button@Hidden gems","nozoom":true},
{"a":"wait","ms":2600},
{"a":"click","to":"button@Mind-bending","nozoom":true},
{"a":"wait","ms":2600},
{"a":"click","to":"[data-c=Crimson]","nozoom":true},
{"a":"wait","ms":2600},
{"a":"click","to":"[data-c=Violet]","nozoom":true},
{"a":"wait","ms":2600},
{"a":"cut"},
{"a":"mark","n":"07 tonight"},
{"a":"hold","on":true},
{"a":"wait","ms":800},
{"a":"click","to":"#mnu","nozoom":true},
{"a":"wait","ms":1900},
{"a":"click","to":".cvn-l button@Tonight","nozoom":true},
{"a":"wait","ms":1800},
{"a":"click","to":".tn .opts button@Regular","nozoom":true},
{"a":"wait","ms":1500},
{"a":"click","to":".tn .opts button@Mind-bending","nozoom":true},
{"a":"wait","ms":1500},
{"a":"click","to":".tn .opts button@English","nozoom":true},
{"a":"wait","ms":4500}
];
const cam={z:1,x:W/2,y:H/2,tw:null,follow:false},cur={x:W*.8,y:H*.85},auto={z:0,out:1500};
let pace=1.25;const T=ms=>ms*pace,ZD=.65;
let k=1,ww=0,wh=0,abort=false,running=false,blurOn=false,outT=0,marks=[],T0=0,wc=0,lastMove=0,last=performance.now();
const isApp=()=>matchMedia('(display-mode: fullscreen)').matches||matchMedia('(display-mode: standalone)').matches;
function layout(){
 if($('#mode').value==='wide'){W=Math.max(1280,Math.min(1600,Math.round(900*innerWidth/innerHeight)));H=Math.max(560,Math.round(W*innerHeight/innerWidth))}else{W=1440;H=900}
 camEl.style.width=ifr.style.width=W+'px';camEl.style.height=ifr.style.height=H+'px';
 const flat=!$('#fr').checked;document.body.classList.toggle('flat',flat);
 const p=flat?0:.04,vw=innerWidth,vh=innerHeight;ww=Math.min(vw*(1-2*p),vh*(1-2*p)*W/H);wh=ww*H/W;
 win.style.width=ww+'px';win.style.height=wh+'px';k=ww/W}
addEventListener('resize',layout);document.addEventListener('fullscreenchange',layout);
$('#fr').onchange=layout;$('#mode').onchange=layout;
function drawCur(){curEl.style.transform=`translate(${cur.x-3}px,${cur.y-2}px)`}
/* camera: reference-style fast ease-out (about 0.5s), cursor-follow with dead zone */
function camTo(z,x,y,dur=ZD,delay=0){cam.tw={t0:performance.now()+delay,dur:dur*1000,a:{z:cam.z,x:cam.x,y:cam.y},b:{z,x,y}}}
const curZ=()=>cam.tw?cam.tw.b.z:cam.z;
function resetCam(){clearTimeout(outT);cam.tw=null;cam.z=1;cam.x=W/2;cam.y=H/2;cam.follow=false;cur.x=W*.8;cur.y=H*.85;drawCur()}
function tick(t){const dt=Math.min(.05,(t-last)/1000);last=t;const pz=cam.z,px=cam.x,py=cam.y;
 if(cam.tw){const w=cam.tw,p=Math.min(1,Math.max(0,(t-w.t0)/w.dur)),e=1-Math.pow(1-p,3);
  cam.z=w.a.z*Math.pow(w.b.z/w.a.z,e);cam.x=w.a.x+(w.b.x-w.a.x)*e;cam.y=w.a.y+(w.b.y-w.a.y)*e;if(p>=1)cam.tw=null}
 else if(cam.follow&&cam.z>1.02){const dx=W/(2*cam.z)*.3,dy=H/(2*cam.z)*.3;let tx=cam.x,ty=cam.y;
  if(cur.x>cam.x+dx)tx=cur.x-dx;else if(cur.x<cam.x-dx)tx=cur.x+dx;
  if(cur.y>cam.y+dy)ty=cur.y-dy;else if(cur.y<cam.y-dy)ty=cur.y+dy;
  const a=1-Math.exp(-dt*7);cam.x+=(tx-cam.x)*a;cam.y+=(ty-cam.y)*a}
 const s=k*cam.z;let tx=ww/2-cam.x*s,ty=wh/2-cam.y*s;
 tx=Math.min(0,Math.max(ww-W*s,tx));ty=Math.min(0,Math.max(wh-H*s,ty));
 camEl.style.transform=`translate(${tx}px,${ty}px) scale(${s})`;
 const mv=Math.abs(cam.z-pz)*400+Math.abs(cam.x-px)+Math.abs(cam.y-py);
 if(mv>.15){lastMove=t;if(!wc){camEl.style.willChange='transform';wc=1}}else if(wc&&t-lastMove>350){camEl.style.willChange='auto';wc=0}
 camEl.style.filter=blurOn?`blur(${Math.min(1.5,mv/Math.max(dt,.001)*.0004).toFixed(2)}px)`:'';
 requestAnimationFrame(tick)}
const D=()=>ifr.contentDocument,Wn=()=>ifr.contentWindow;
function find(sel){let e;
 if(sel.includes('@')){const[i,t]=sel.split('@'),q=t.trim().toLowerCase();
  e=[...D().querySelectorAll(i||'*')].filter(x=>x.getClientRects().length&&x.textContent.trim().toLowerCase().startsWith(q)).sort((a,b)=>a.textContent.length-b.textContent.length)[0]}
 else e=D().querySelector(sel);
 if(!e)throw Error('nahi mila: '+sel);return e}
const ctr=e=>{const r=e.getBoundingClientRect();return{x:r.left+r.width/2,y:r.top+r.height/2}};
const ease=p=>p<.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2;
function moveTo(x,y,ms){const x0=cur.x,y0=cur.y,dx=x-x0,dy=y-y0,cx=x0+dx/2-dy*.1,cy=y0+dy/2+dx*.1;curEl.classList.add('on');
 return new Promise(res=>{const t0=performance.now();(function f(n){if(abort)return res();const p=ease(Math.min(1,(n-t0)/ms)),q=1-p;
  cur.x=q*q*x0+2*q*p*cx+p*p*x;cur.y=q*q*y0+2*q*p*cy+p*p*y;drawCur();p<1?requestAnimationFrame(f):res()})(t0)})}
function scrollTo(y,ms,el){const w=el||Wn(),y0=el?el.scrollTop:w.scrollY;return new Promise(res=>{const t0=performance.now();(function f(n){if(abort)return res();
 const p=ease(Math.min(1,(n-t0)/ms)),v=y0+(y-y0)*p;el?el.scrollTop=v:w.scrollTo(0,v);p<1?requestAnimationFrame(f):res()})(t0)})}
function scroller(e){for(let n=e.parentElement;n;n=n.parentElement){const o=Wn().getComputedStyle(n).overflowY;if((o==='auto'||o==='scroll')&&n.scrollHeight>n.clientHeight+4)return n}return null}
async function reveal(e){const r=e.getBoundingClientRect();if(r.top<90||r.bottom>H-90){const sc=scroller(e);
 if(sc&&sc!==D().body&&sc!==D().documentElement)await scrollTo(sc.scrollTop+r.top-sc.getBoundingClientRect().top-H/3,1100,sc);else await scrollTo(Wn().scrollY+r.top-H/3,1200)}}
function ripple(){const r=document.createElement('div');r.className='rip';r.style.left=cur.x+'px';r.style.top=cur.y+'px';camEl.appendChild(r);setTimeout(r.remove.bind(r),800);
 curEl.classList.add('dn');setTimeout(()=>curEl.classList.remove('dn'),160)}
function tapEl(t){const w=Wn();let n=t;while(n&&typeof n.click!=='function')n=n.parentElement;n=n||t;
 const o={bubbles:true,cancelable:true,view:w,pointerType:'mouse',button:0,clientX:cur.x,clientY:cur.y};
 for(const ty of['pointerdown','mousedown','pointerup','mouseup']){try{n.dispatchEvent(new(ty[0]=='p'?w.PointerEvent:w.MouseEvent)(ty,o))}catch(e){}}
 typeof n.click==='function'?n.click():n.dispatchEvent(new w.MouseEvent('click',o))}
/* anticipation: camera starts zooming while the cursor is still travelling, so it lands zoomed before the click */
const zl=s=>s.nozoom?0:(s.z!==undefined?s.z:auto.z);
async function approach(e,s){clearTimeout(outT);await reveal(e);let c=ctr(e);const z=zl(s);
 const ms=(s.mv||Math.max(520,Math.min(1200,Math.hypot(c.x-cur.x,c.y-cur.y)*.95)));const mv=moveTo(c.x,c.y,ms);
 if(z>1){cam.follow=false;camTo(z,c.x,c.y,ZD,Math.max(0,ms-ZD*1000+120))}else if(z===1){cam.follow=false;camTo(1,W/2,H/2,ZD,Math.max(0,ms-ZD*1000+120))}
 await mv;const c2=ctr(e);
 if(Math.hypot(c2.x-c.x,c2.y-c.y)>10){await moveTo(c2.x,c2.y,260);if(z>1)camTo(z,c2.x,c2.y,.4);c=c2}
 if(z>1)setTimeout(()=>{cam.follow=true},700);return c}
function armOut(s){clearTimeout(outT);const o=s.out!==undefined?s.out:auto.out;
 if(o>0&&curZ()>1.02)outT=setTimeout(()=>{cam.follow=false;camTo(1,W/2,H/2,ZD)},T(o))}
const A={
 wait:s=>sleep(T(s.ms||500)),
 auto:s=>{auto.z=s.z||0;auto.out=s.out===undefined?1500:s.out},
 async zoom(s){clearTimeout(outT);const z=s.z||1;
  if(s.to){const e=find(s.to);if(s.nocursor){await reveal(e);const c=ctr(e);cam.follow=false;camTo(z,c.x,c.y,ZD)}else await approach(e,{z})}
  else{cam.follow=z>1;camTo(z,z>1?cur.x:W/2,z>1?cur.y:H/2,ZD)}
  await sleep(T(s.ms||900))},
 async move(s){const e=find(s.to);await approach(e,s);armOut(s)},
 async click(s){const e=find(s.to);const c=await approach(e,s);await sleep(110);ripple();
  tapEl(D().elementFromPoint(c.x,c.y)||e);await sleep(T(s.after||250));armOut(s)},
 async type(s){const e=find(s.to);e.focus();for(const ch of s.text){if(abort)return;e.value+=ch;
  e.dispatchEvent(new Event('input',{bubbles:true}));await sleep(s.gap||85)}},
 async scroll(s){const el=s.in?find(s.in):null,base=el?el.scrollTop:Wn().scrollY;
  const y=s.to?base+find(s.to).getBoundingClientRect().top-(el?el.getBoundingClientRect().top:0)-(s.off??120):s.by!=null?base+s.by:s.y;await scrollTo(y,T(s.ms||1800),el)},
 async hover(s){const e=find(s.to);await approach(e,s);
  for(const t of['pointerover','pointerenter'])e.dispatchEvent(new(Wn().PointerEvent)(t,{bubbles:true,pointerType:'mouse'}));await sleep(T(s.hold||1000));armOut(s)},
 hold:s=>{try{const d=D();s.on?Object.defineProperty(d,'hidden',{get:()=>true,configurable:true}):delete d.hidden}catch(e){}},
 mark:s=>{marks.push([s.n,(performance.now()-T0)/1000])},
 async tap(s){tapEl(find(s.to))},
 async cut(s){fade.style.transition='opacity .35s';fade.style.opacity=1;await sleep(450);curEl.classList.remove('on');resetCam();
  if(s.reload!==false)await loadSite($('#path').value,false,true);
  if(s.pre)for(const p of s.pre){try{await A[p.a](p)}catch(e){}}
  resetCam();await sleep(T(s.hold||(s.reload===false?600:1300)));fade.style.transition='opacity .4s';fade.style.opacity=0;await sleep(450)}
};
async function run(steps){const bad=[];for(const s of steps){if(abort)break;try{await A[s.a](s)}catch(e){bad.push(s.a+': '+e.message)}}return bad}
function patchDoc(){try{const C=Wn().Clipboard.prototype;C.writeText=()=>Promise.resolve();C.write=()=>Promise.resolve()}catch(e){}}
function newFrame(){const n=document.createElement('iframe');n.id='ifr';n.style.width=W+'px';n.style.height=H+'px';ifr.replaceWith(n);ifr=n}
function liteCss(){if(!$('#lite').checked)return;try{const d=D(),s=d.createElement('style');
 s.textContent='*,*::before,*::after{backdrop-filter:none!important;-webkit-backdrop-filter:none!important}.grain{display:none!important}';d.head.appendChild(s)}catch(e){}}
function loadSite(path,intro=true,keep=false){
 return new Promise(res=>{try{if(intro){sessionStorage.removeItem('cv_i');sessionStorage.removeItem('cv_intro')}else{sessionStorage.setItem('cv_i','1');sessionStorage.setItem('cv_intro','1')}}catch(e){}
  fade.style.transition='none';fade.style.opacity=1;newFrame();
  setTimeout(()=>{ifr.src=path+(path.includes('?')?'&':'?')+'stage='+Date.now();const t0=Date.now();
   const iv=setInterval(()=>{let ok=0;try{const d=ifr.contentDocument;ok=d&&d.body&&d.readyState!=='loading'&&d.location.href.indexOf('about:blank')<0}catch(e){}
    if(ok||Date.now()-t0>6000){clearInterval(iv);patchDoc();liteCss();if(keep)return res();
     setTimeout(()=>{fade.style.transition='opacity .3s';fade.style.opacity=0;res()},intro?100:600)}},40)},120)})}
const fmt=t=>Math.floor(t/60)+':'+String(Math.floor(t%60)).padStart(2,'0');
async function start(){if(running)return;let steps;
 try{steps=JSON.parse($('#scr').value)}catch(e){$('#msg').textContent='Script JSON galat hai: '+e.message;return}
 try{localStorage.setItem('stg_scr',$('#scr').value)}catch(e){}
 running=true;abort=false;blurOn=$('#bl').checked;pace=+$('#pace').value||1.25;$('#msg').textContent='';marks=[];T0=performance.now();let wl;
 if($('#fs').checked&&!document.fullscreenElement&&!isApp())try{await document.documentElement.requestFullscreen();await sleep(900)}catch(e){}
 try{wl=await navigator.wakeLock.request('screen')}catch(e){}
 layout();$('#panel').classList.add('h');curEl.classList.remove('on');resetCam();auto.z=0;
 fade.style.transition='none';fade.style.opacity=1;
 const n=+$('#cdn').value||5,cd=$('#cd');cd.style.display='flex';
 const pre=loadSite($('#path').value,false,true);
 for(let i=n;i>0&&!abort;i--){cd.textContent=i;await sleep(1000)}
 await pre;cd.style.display='none';
 if(!abort)await loadSite($('#path').value,true);
 const bad=abort?[]:await run(steps);
 marks.push(['END',(performance.now()-T0)/1000]);
 running=false;clearTimeout(outT);curEl.classList.remove('on');fade.style.transition='opacity .3s';fade.style.opacity=0;$('#panel').classList.remove('h');try{wl&&wl.release()}catch(e){}
 const lst=marks.map((m,i)=>m[0]==='END'?'':m[0]+'  '+fmt(m[1])+' - '+fmt(marks[i+1][1])).filter(Boolean).join('\n');
 $('#msg').textContent=(abort?'Rok diya.':'Done - ab recorder stop karo.')+'\nCut list (Start dabane ke time se):\n'+lst+(bad.length?'\nSkip hue:\n'+bad.join('\n'):'')}
let tap=0;$('#stop').onclick=()=>{const n=Date.now();if(n-tap<500){abort=true;$('#cd').style.display='none'}tap=n};
$('#go').onclick=start;
$('#rs').onclick=()=>{$('#scr').value=JSON.stringify(DEF,null,1)};
try{if(localStorage.getItem('stg_ver')==='7')$('#scr').value=localStorage.getItem('stg_scr')||'';localStorage.setItem('stg_ver','7')}catch(e){}
if(!$('#scr').value)$('#rs').click();
$('#info').textContent=isApp()?'App mode ON (fullscreen app) - recording ke liye best.':'Tip: Chrome menu > Install app, phir "Parda Stage" icon se kholo. Isse fullscreen + landscape bina black screen ke milta hai.';
layout();drawCur();requestAnimationFrame(tick);
</script></body></html>
