<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CINEVAULT — Explore films in their own colour</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Cormorant+Garamond:ital,wght@0,500;1,500&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css"></head><body>
<div class="grain"></div>
<header id="top"><a class="logo" href="#" data-view="home">CINEVAULT</a>
<nav><a href="#" data-view="home">Explore</a><a href="#" data-view="list">My list</a></nav>
<input id="q" type="search" placeholder="Search any film or series" autocomplete="off"></header>
<main>
<section id="hero"><div class="bd" id="bd"></div><div class="shade"></div>
<div class="hc"><p class="meta" id="hmeta"></p><h1 id="htitle"></h1><p class="ov" id="hov"></p>
<button class="btn" id="hopen">Trailer &amp; details</button></div>
<div class="dots" id="dots"></div></section>
<div id="rows"></div>
<section id="results" hidden><h2 class="rt">Results</h2><div class="grid" id="rgrid"></div></section>
<section id="list" hidden><h2 class="rt">My list</h2><div class="tabs" id="tabs"></div><div class="grid" id="lgrid"></div></section>
</main>
<div id="modal" hidden><div class="mbox" id="mbox"><button class="x" id="mx" aria-label="Close">Close</button><div id="mc"></div></div></div>
<script src="config.js"></script><script src="app.js"></script></body></html>
