    var L = [], c = cfgObj();
    L.push("=== CINEVAULT DEBUG REPORT ===");
    L.push("debug build: " + BUILD + " | time: " + new Date().toISOString() + " | page age: " + ts());
    L.push("URL: " + mask(location.href) + " | host: " + location.hostname);
    L.push("online: " + navigator.onLine + " | net: " + ((navigator.connection && (navigator.connection.effectiveType + " " + navigator.connection.downlink + "Mbps")) || "n/a") + " | secure ctx: " + window.isSecureContext + " | viewport: " + innerWidth + "x" + innerHeight);

    L.push("");
    L.push("--- VERDICT ---");

    else if (RUNNING) L.push("⏳ tests running…");
    var fails = CHORDER.filter(function (i) { return CH[i].ok === false; }), warns = CHORDER.filter(function (i) { return CH[i].ok === null; });
    var ev = counts(), nev = Object.keys(ev).length;
    var hs = LOG.filter(function (x) { return x.msg === "home start"; }).length, hok = LOG.filter(function (x) { return /^hero ok|home-fail/.test(x.msg); }).length;
    if (RAN && !RUNNING) {
      if (!fails.length) L.push("✓ no failing checks");
      else L.push("✗ " + fails.length + " failing check(s):");
      fails.forEach(function (i, n) { L.push("  " + (n + 1) + ". " + CH[i].name + " → " + CH[i].detail); L.push("     FIX: " + CH[i].fix); });
      if (CH.direct && CH.proxy && CH.direct.ok === false && CH.proxy.ok === false) L.push("✗ BLANK HOME EXPLAINED: TMDB unreachable both ways (direct AND proxy) → hero cannot load.");
      else if (CH.direct && CH.proxy && CH.direct.ok === false && CH.proxy.ok) L.push("⚠ direct TMDB blocked on this network but proxy works (fine).");
      else if (CH.direct && CH.proxy && CH.proxy.ok === false && CH.direct.ok) L.push("⚠ proxy broken but direct TMDB works (app should fall back).");
      if (hs && !hok && Date.now() - T0 > 15000) L.push("✗ home() started but never finished/failed after " + ts() + " → a request is hanging (see TIMELINE).");
      if (typeof home !== "function") L.push("✗ app.js did not execute → hero/rows never start (see file checks + ERRORS).");
      if (!fails.length && !(CH.direct && !CH.direct.ok && CH.proxy && !CH.proxy.ok)) L.push("If page is still blank with all ✓: look at ERRORS and TIMELINE below.");
    }
    L.push("");
    L.push("--- CHECKS (run live from this device) ---");
    CHORDER.forEach(function (i) { var x = CH[i]; L.push((x.ok === true ? "✓ " : x.ok === false ? "✗ " : "⚠ ") + x.name + " — " + x.detail); });
    L.push("");
    L.push("--- PAGE STATE ---");
    domInfo().forEach(function (x) { L.push(x); });
    storeInfo().forEach(function (x) { L.push(x); });
    L.push("Firebase cfg in page: " + (c ? "project=" + c.projectId + " authDomain=" + c.authDomain + " apiKey=" + mk(c.apiKey) + " dbId=" + (c.firestoreDatabaseId || "(default)") : "MISSING"));
    var res = []; try { res = performance.getEntriesByType("resource").filter(function (r) { return r.name.indexOf(location.origin) === 0 || /themoviedb|gstatic|googleapis|firebase/.test(r.name); }).slice(-45); } catch (e) { }
    L.push("");
    L.push("--- RESOURCES LOADED (browser's own record; status 0/? = blocked or cross-origin hidden) ---");
    res.forEach(function (r) { L.push((r.responseStatus !== undefined ? r.responseStatus : "?") + " " + r.initiatorType + " " + mask(r.name.replace(location.origin, "")).slice(0, 110) + " " + Math.round(r.duration) + "ms"); });
    L.push("");
    L.push("--- ERRORS & WARNINGS (grouped) ---");
    if (!nev) L.push("(none recorded)");
    Object.keys(ev).forEach(function (k) { L.push((ev[k].n > 1 ? ev[k].n + "x " : "") + "[" + ev[k].t + "] " + k); });
    L.push("");
    L.push("--- TIMELINE (everything since page open; typed text is never recorded) ---");
    LOG.slice(-260).forEach(function (x) { L.push(x.t + " " + x.type + " " + x.msg); });
    L.push("=== END ===");
    return L;
  }

  /* ---------- panel ---------- */
  var timer = null;
  function sched() { if (timer) return; timer = setTimeout(function () { timer = null; paint(); }, 150); }
  function esc(t) { return String(t).replace(/[&<>]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]; }); }
  function paint() {
    var out = document.getElementById("cvd-out"); if (!out) return;
    var atBottom = false, L = build();
    out.innerHTML = L.map(function (l) {
      var c = /^✓/.test(l) ? "g" : /^✗|^ {2}\d+\. |^ {5}FIX/.test(l) ? "r" : /^⚠|^⏳/.test(l) ? "a" : /^---|^===/.test(l) ? "h" : /(ERROR|FAIL)/.test(l.split(" ")[1] || "") ? "r" : "";
      return c ? '<span class="' + c + '">' + esc(l) + "</span>" : esc(l);
    }).join("\n");
  }
  function copyText(txt, btn) {
    var done = function (ok) { btn.textContent = ok ? "Copied ✓" : "Select & copy manually"; setTimeout(function () { btn.textContent = "Copy report"; }, 2200); };
    var fb = function () { try { var ta = document.createElement("textarea"); ta.value = txt; ta.style.cssText = "position:fixed;top:0;left:0;opacity:0"; document.body.appendChild(ta); ta.focus(); ta.select(); var ok = document.execCommand("copy"); ta.remove(); done(ok); } catch (e) { done(false); } };

  }
  function openPanel() {
    if (document.getElementById("cvdbg")) { OPEN = true; paint(); return; }
    var st = document.createElement("style");
    st.textContent = "#cvdbg{position:fixed;inset:0;z-index:2147483647;background:#0a0b0e;color:#cfd2d8;font:11px/1.45 ui-monospace,Menlo,Consolas,monospace;display:flex;flex-direction:column}#cvdbg .b{display:flex;gap:6px;flex-wrap:wrap;padding:calc(env(safe-area-inset-top,0px) + 8px) 8px 8px;background:#14161b;border-bottom:1px solid #2a2d35}#cvdbg button{font:600 12px system-ui,sans-serif;padding:9px 11px;border-radius:9px;border:1px solid #3a3e48;background:#1e2128;color:#eee}#cvdbg button.p{background:#e0a030;color:#111;border-color:#e0a030}#cvd-out{flex:1;overflow:auto;margin:0;padding:10px;white-space:pre-wrap;word-break:break-word;-webkit-user-select:text;user-select:text}#cvd-out .g{color:#7ee2a0}#cvd-out .r{color:#ff8c8c}#cvd-out .a{color:#ffd37a}#cvd-out .h{color:#e0a030;font-weight:700}";
    document.head.appendChild(st);
    var d = document.createElement("div"); d.id = "cvdbg";
    d.innerHTML = '<div class="b"><button class="p" data-x="run">Run tests</button><button data-x="copy">Copy report</button><button data-x="clr">Clear cache + reload</button><button data-x="key">Clear saved key</button><button data-x="x">Close</button></div><pre id="cvd-out"></pre>';
    document.body.appendChild(d);
    d.addEventListener("click", function (e) {
      var b = e.target.closest("button"); if (!b) return; var a = b.getAttribute("data-x");
      if (a === "x") { OPEN = false; d.remove(); }
      else if (a === "run") runTests();
      else if (a === "copy") copyText(build().join("\n"), b);
      else if (a === "key") { try { localStorage.removeItem("cv_key"); push("debug", "removed saved TMDB key"); } catch (x) { } paint(); }
      else if (a === "clr") {
        try { Object.keys(localStorage).filter(function (k) { return /^c:/.test(k) || k === "cv_key"; }).forEach(function (k) { localStorage.removeItem(k); }); } catch (x) { }
        var p = [];
        try { if (navigator.serviceWorker) p.push(navigator.serviceWorker.getRegistrations().then(function (r) { return Promise.all(r.map(function (x) { return x.unregister(); })); })); } catch (x) { }
        try { if (window.caches) p.push(caches.keys().then(function (k) { return Promise.all(k.map(function (x) { return caches.delete(x); })); })); } catch (x) { }
        Promise.all(p).then(function () { location.reload(); }, function () { location.reload(); });
      }
    });
    OPEN = true; paint(); if (!RAN) runTests();
  }

  /* ---------- 7-tap trigger on the logo ---------- */
  var taps = 0, last = 0, hint = null;
  document.addEventListener("click", function (e) {
    var el = e.target && e.target.closest && e.target.closest(".logo,.cva-logo,#intro span"); if (!el) return;
    var n = Date.now(); taps = n - last < 2000 ? taps + 1 : 1; last = n;
    if (taps >= 4 && taps < 7) {
      if (!hint) { hint = document.createElement("div"); hint.style.cssText = "position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#e0a030;color:#111;padding:6px 12px;border-radius:99px;font:600 12px system-ui;z-index:2147483646"; document.body.appendChild(hint); }
      hint.textContent = (7 - taps) + " more…"; clearTimeout(hint._t); hint._t = setTimeout(function () { if (hint) { hint.remove(); hint = null; } }, 1500);
    }
    if (taps >= 7) { taps = 0; if (hint) { hint.remove(); hint = null; } e.preventDefault(); e.stopPropagation(); openPanel(); }
  }, true);

  window.cvDbg = { log: function (t, m) { push("app", t + " " + s(m, 300)); }, err: function (t, e) { push("app-ERROR", t + ": " + s(e, 300)); }, open: openPanel, report: function () { return build().join("\n"); }, run: runTests };
})();
